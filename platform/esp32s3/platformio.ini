; ============================================================================
; FunAIGameEngine - ESP32-S3 导出模板(由 tools/engine.py export 生成完整工程)
; 显示: Arduino_GFX(ILI9488 480x320), 音频: I2S + 引擎软混音, 素材: SPIFFS
; 引脚在 src/esp_display.cpp / src/esp_audio.cpp 顶部改。
; ============================================================================
[env:esp32s3]
platform = espressif32@6.3.2
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = spiffs

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE=1
    -I include
    -I include/engine
    -I include/games
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    lvgl/lvgl@8.3.11
    moononournation/Arduino_GFX@^1.3.6
