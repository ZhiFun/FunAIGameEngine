; ============================================================================
; FunAIGameEngine 硬件实例: FunModularKeyboard (ESP32-S3 键盘主机)
;
; 这是"默认实例" —— tools/engine.py export 不指定 --target 时就用它。
;
; 硬件参数取自 FunModularKeyboard 实际参与编译的配置:
;   显示 : TFT_eSPI + NV3007, 428x142, 横屏(rotation 1), SPI 60MHz + DMA
;          BL=37(低电平点亮) CS=40 DC=45 RST=46 MOSI=42 SCLK=41
;   音频 : I2S1 (MAX98357)  BCLK=16 LRC=39 DOUT=38
;   存储 : 4MB Flash / SPIFFS (素材用)
;   PSRAM: 已启用 (LVGL 绘制缓冲 + 内存池都放 PSRAM)
;
; 分区表沿用键盘工程原样, 盘面位置完全一致, 避免 uploadfs 擦到别处。
; ============================================================================
[env:esp32s3keyboard]
platform = espressif32@6.3.2
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_build.partitions = partitions-4MB.csv
board_build.filesystem = spiffs
board_build.flash_mode = qio
board_build.f_flash = 80000000L

build_flags =
    ; ---- PSRAM ----
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

    ; ---- LVGL: 用 include/lv_conf.h ----
    -DLV_CONF_INCLUDE_SIMPLE=1

    ; ---- TFT_eSPI: 由本工程提供配置, 不需要改库文件 ----
    ; USER_SETUP_LOADED 让库跳过 User_Setup_Select.h, 改用 -include 进来的
    ; include/nv3007_setup.h (内容等价于库内 Setup350_NV3007.h)。
    -DUSER_SETUP_LOADED=1
    -include nv3007_setup.h

    -I include
    -I include/engine
    -I include/games
    -DARDUINO_USB_CDC_ON_BOOT=1
    -ffunction-sections
    -fdata-sections

lib_deps =
    lvgl/lvgl@8.3.11
    bodmer/TFT_eSPI@^2.5.43
